apiVersion: v1
kind: Service
metadata:
  name: pata-api
  namespace: pata
  labels:
    app: pata-api
  annotations:
    # Prometheus ServiceMonitor annotation (if using kube-prometheus-stack)
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/v1/metrics"
spec:
  type: ClusterIP
  selector:
    app: pata-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
