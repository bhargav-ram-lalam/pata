[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pata"
version = "0.4.0"
description = "AI address resolution system for Indian last-mile delivery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pata Engineering Team" }
]
dependencies = [
    "bharataddress>=0.4.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "indic_transliteration>=2.3.0",
    "RapidFuzz>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    # Stage 4: distributed state + Postgres
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
indic = ["indic_transliteration>=2.3.0"]
fuzzy = ["RapidFuzz>=3.0.0"]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pata*", "api*", "agents*", "persistence*", "resilience*", "observability*"]
